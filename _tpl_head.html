<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Post-Workshop Home-Based Worker Survey — live fieldwork and analysis dashboard. Research Solutions." />
  <title>Post-Workshop HBW Survey — Live Dashboard | Research Solutions</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23E8192C'/%3E%3Ctext y='72' x='50' text-anchor='middle' font-size='58' font-family='Arial' fill='white' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rs-red:#E8192C; --rs-red-dark:#B5101E; --rs-red-mid:#C41020; --rs-red-muted:#F47885; --rs-red-light:#FDECEA; --rs-red-50:#FFF5F5;
      --rs-navy:#2D3450; --rs-navy-dark:#1E2438; --rs-navy-mid:#3D4566; --rs-navy-soft:#6B7494; --rs-navy-light:#E8EAF2; --rs-navy-50:#F2F3F8;
      --rs-cream:#FAF8F4; --white:#FFFFFF;
      --teal-700:#0E7490; --teal-500:#0891B2; --teal-300:#67E8F9; --teal-100:#CFFAFE; --teal-50:#ECFEFF;
      --amber-600:#D97706; --amber-500:#F59E0B; --amber-400:#FBBF24; --amber-100:#FEF3C7; --amber-50:#FFFBEB;
      --purple-700:#6D28D9; --purple-500:#8B5CF6; --purple-100:#EDE9FE; --purple-50:#F5F3FF;
      --green-600:#16A34A; --green-100:#DCFCE7; --green-50:#F0FDF4;
      --n-900:#0f172a; --n-800:#1e293b; --n-700:#334155; --n-600:#475569; --n-400:#94a3b8; --n-200:#e2e8f0; --n-100:#f1f5f9;

      /* semantic surfaces — the only things dark mode re-points */
      --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#FFFFFF;
      --text:#2D3450; --text-2:#475569; --text-3:#94A3B8;
      --border:#E2E8F0; --track:#F1F5F9; --grid:#EEF1F6;
      /* Categorical series slots — assigned in fixed order, never cycled. Validated
         against the #FFFFFF chart surface: lightness band, chroma floor, protan /
         deutan separation and 3:1 contrast all pass. */
      --series-1:#3C549D; --series-2:#D31929; --series-3:#198FAF; --series-4:#C06B42;
      --series-5:#8356C4; --series-6:#179142; --series-7:#D65E91; --series-8:#CC851B;
      --muted-fill:#E2E8F0;
      /* Fixed role colours — the wife/husband contrast carries the whole dashboard,
         so it never borrows a categorical slot. */
      --wife:#8356C4; --husband:#198FAF; --agree:#179142; --disagree:#D31929;
      --shadow:0 1px 4px rgba(45,52,80,.07),0 4px 16px rgba(45,52,80,.05);
      --shadow-lg:0 6px 24px rgba(45,52,80,.12);
      --tint-red:var(--rs-red-light); --tint-navy:var(--rs-navy-light); --tint-amber:var(--amber-100);
      --tint-teal:var(--teal-100); --tint-purple:var(--purple-100); --tint-green:var(--green-100);
      --on-tint-red:#6B0A12; --on-tint-navy:var(--rs-navy-dark); --on-tint-amber:#78350f;
      --on-tint-teal:var(--teal-700); --on-tint-purple:var(--purple-700); --on-tint-green:#14532d;
    }
    html[data-theme="dark"] {
      --bg:#12151F; --surface:#1A1F2E; --surface-2:#222839;
      --text:#E7EAF3; --text-2:#A3ADC2; --text-3:#6F7A91;
      --border:#2C3346; --track:#252B3B; --grid:#262D3E;
      --shadow:0 1px 4px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.28);
      --shadow-lg:0 8px 28px rgba(0,0,0,.5);
      --rs-navy-50:#202635; --rs-navy-light:#2A3145; --n-100:#252B3B; --n-200:#2C3346;
      /* Same hues re-stepped for the #1A1F2E surface — not a lightened flip. */
      --series-1:#5B79D2; --series-2:#EC2130; --series-3:#1B96B7; --series-4:#D76528;
      --series-5:#9C59F2; --series-6:#1CA24B; --series-7:#B74276; --series-8:#BE8334;
      --muted-fill:#333B50;
      --wife:#9C59F2; --husband:#1B96B7; --agree:#1CA24B; --disagree:#EC2130;
      --tint-red:#3A1A20; --tint-navy:#232A3D; --tint-amber:#3A2E12;
      --tint-teal:#12313B; --tint-purple:#2A2140; --tint-green:#12321F;
      --on-tint-red:#FCA5AD; --on-tint-navy:#C3CAE0; --on-tint-amber:#FCD34D;
      --on-tint-teal:#67E8F9; --on-tint-purple:#C4B5FD; --on-tint-green:#86EFAC;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh;
           transition:background .25s ease, color .25s ease; -webkit-font-smoothing:antialiased; }

    /* ===================== HEADER ===================== */
    /* The masthead is NOT sticky. An earlier build pinned it and shrank it on
       scroll; changing a sticky element's height mid-scroll reflows the whole
       document on every frame and jumps the content under the reader. Only the
       tabs and filters are pinned now, at one constant height. */
    .header { background:var(--rs-navy-dark); color:white; }
    .header-inner { max-width:1560px; margin:0 auto; padding:0 32px; display:flex; flex-direction:column; }
    .header-top { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:14px 0 12px; }
    .header-logo-wrap img { height:44px; display:block; }

    .stickybar { position:sticky; top:0; z-index:100; border-bottom:3px solid var(--rs-red);
                 box-shadow:0 4px 20px rgba(0,0,0,.28); }
    .stickybar-nav { background:var(--rs-navy-dark); }
    .stickybar-nav .nav-tabs { max-width:1560px; margin:0 auto; padding:7px 32px; }
    .header-study { text-align:center; flex:1; padding:0 16px; }
    .header-study-title { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:#fff; letter-spacing:-.2px; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
    .live-chip { font-family:'Inter',sans-serif; font-size:9.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; background:var(--green-600); color:#fff; padding:3px 9px; border-radius:5px; display:inline-flex; align-items:center; gap:5px; }
    .live-chip i { width:6px; height:6px; border-radius:99px; background:#fff; animation:pulse 2s infinite; display:block; }
    .header-study-sub { font-size:11px; color:rgba(255,255,255,.55); letter-spacing:.6px; text-transform:uppercase; margin-top:4px; }
    .header-meta { text-align:right; font-size:12px; color:rgba(255,255,255,.55); line-height:1.7; white-space:nowrap; }
    .header-meta strong { color:rgba(255,255,255,.9); font-size:13px; }
    .header-pill { display:inline-block; background:var(--rs-red); color:#fff; font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; padding:3px 10px; border-radius:99px; margin-top:4px; }
    .hbtn { margin-top:8px; margin-left:6px; display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:rgba(255,255,255,.8);
            font-family:'Inter',sans-serif; font-size:11px; font-weight:600; letter-spacing:.3px; padding:5px 11px; border-radius:99px; cursor:pointer; transition:background .2s,color .2s; }
    .hbtn:hover { background:rgba(255,255,255,.18); color:#fff; }

    /* Thirteen sections will not fit on one row of a laptop screen, and a
       horizontally-scrolling strip hides the last tabs with no visible cue —
       so the strip wraps and every section stays reachable at a glance. */
    .nav-tabs { display:flex; flex-wrap:wrap; gap:4px; }
    .nav-tab { padding:8px 12px; font-size:12px; font-weight:500; color:rgba(255,255,255,.62); cursor:pointer;
               border-radius:8px; border:none; background:rgba(255,255,255,.05); white-space:nowrap;
               transition:background .2s,color .2s; letter-spacing:.2px; font-family:'Inter',sans-serif; }
    .nav-tab:hover { color:#fff; background:rgba(255,255,255,.14); }
    .nav-tab.active { color:#fff; background:var(--rs-red); font-weight:700; box-shadow:0 2px 8px rgba(232,25,44,.35); }
    .nav-tab.active:hover { background:var(--rs-red-dark); }

    /* ===================== GLOBAL FILTER BAR ===================== */
    /* Lives inside .header, so it inherits the sticky behaviour and can never
       drift out of alignment with the bar above it. */
    .filterbar { background:var(--surface); border-top:1px solid var(--border); }
    .filterbar-inner { max-width:1560px; margin:0 auto; padding:11px 32px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .fb-label { font-size:10.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--text-3); margin-right:2px; }
    .fb-sel { padding:7px 11px; border:1.5px solid var(--border); border-radius:9px; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500;
              color:var(--text); background:var(--surface); cursor:pointer; outline:none; transition:border-color .2s; max-width:220px; }
    .fb-sel:focus, .fb-sel:hover { border-color:var(--rs-red); }
    .fb-reset { padding:7px 13px; border:none; border-radius:9px; background:var(--rs-navy); color:#fff; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:background .2s; }
    .fb-reset:hover { background:var(--rs-red); }
    .fb-count { margin-left:auto; font-size:12.5px; font-weight:600; color:var(--text-2); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:8px; }
    .fb-count b { color:var(--text); }
    .fb-active { display:inline-block; width:8px; height:8px; border-radius:99px; background:var(--amber-500); }

    .main { max-width:1560px; margin:0 auto; padding:26px 32px 60px; }
    .panel { display:none; }
    .panel.active { display:block; animation:fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .section-header { margin-bottom:24px; padding-bottom:16px; border-bottom:2px solid var(--border); display:flex; align-items:flex-start; gap:14px; }
    .section-header-accent { width:4px; min-height:52px; border-radius:99px; background:var(--rs-red); flex-shrink:0; margin-top:4px; }
    .section-header h2 { font-size:26px; font-weight:700; color:var(--text); font-family:'Playfair Display',serif; }
    .section-header .eyebrow { font-size:10.5px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--rs-red); margin-bottom:5px; }
    .section-header p { font-size:14px; color:var(--text-2); margin-top:6px; line-height:1.65; max-width:980px; }

    /* ===================== KPI ===================== */
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:16px; margin-bottom:24px; }
    .kpi-card { background:var(--surface); border-radius:14px; padding:22px 20px; box-shadow:var(--shadow); border-left:4px solid var(--rs-red); transition:transform .2s,box-shadow .2s; position:relative; overflow:hidden; }
    .kpi-card::after { content:''; position:absolute; top:0; right:0; width:80px; height:80px; background:var(--tint-red); border-radius:0 14px 0 80px; opacity:.7; }
    .kpi-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
    .kpi-card.navy { border-left-color:var(--rs-navy-soft); } .kpi-card.navy::after { background:var(--tint-navy); }
    .kpi-card.amber { border-left-color:var(--amber-500); } .kpi-card.amber::after { background:var(--tint-amber); }
    .kpi-card.teal { border-left-color:var(--teal-500); } .kpi-card.teal::after { background:var(--tint-teal); }
    .kpi-card.purple { border-left-color:var(--purple-500); } .kpi-card.purple::after { background:var(--tint-purple); }
    .kpi-card.green { border-left-color:var(--green-600); } .kpi-card.green::after { background:var(--tint-green); }
    .kpi-icon { font-size:23px; margin-bottom:10px; position:relative; z-index:1; }
    .kpi-value { font-size:31px; font-weight:800; color:var(--text); line-height:1.05; position:relative; z-index:1; letter-spacing:-.6px; font-variant-numeric:tabular-nums; }
    .kpi-value.sm { font-size:22px; }
    .kpi-label { font-size:11.5px; color:var(--text-2); margin-top:7px; text-transform:uppercase; letter-spacing:.5px; font-weight:600; position:relative; z-index:1; }
    .kpi-delta { font-size:11px; font-weight:600; margin-top:9px; padding:3px 8px; border-radius:99px; display:inline-block; position:relative; z-index:1; line-height:1.5; }
    .kpi-delta.up { background:var(--tint-teal); color:var(--on-tint-teal); }
    .kpi-delta.down { background:var(--tint-red); color:var(--on-tint-red); }
    .kpi-delta.neutral { background:var(--tint-amber); color:var(--on-tint-amber); }
    .kpi-delta.navy { background:var(--tint-navy); color:var(--on-tint-navy); }
    .kpi-delta.green { background:var(--tint-green); color:var(--on-tint-green); }

    /* ===================== CHART CARDS ===================== */
    .chart-grid { display:grid; gap:20px; margin-bottom:24px; }
    .chart-grid.cols-2 { grid-template-columns:repeat(2,1fr); }
    .chart-grid.cols-3 { grid-template-columns:repeat(3,1fr); }
    .chart-card { background:var(--surface); border-radius:14px; padding:22px 24px 24px; box-shadow:var(--shadow); position:relative; transition:box-shadow .2s; }
    .chart-card:hover { box-shadow:var(--shadow-lg); }
    .chart-card.full { grid-column:1/-1; }
    .chart-card h3 { font-size:14.5px; font-weight:700; color:var(--text); margin-bottom:4px; padding-left:10px; border-left:3px solid var(--rs-red); padding-right:66px; line-height:1.4; }
    .chart-card h3 .qn { font-size:10.5px; font-weight:800; color:var(--rs-red); letter-spacing:.6px; margin-right:6px; }
    /* The full question wording, verbatim from the SurveyCTO form — the point of
       the card is that the reader never has to guess what was asked. */
    .chart-q { font-size:12.2px; color:var(--text-2); margin:7px 0 4px 13px; line-height:1.55; padding-right:66px; font-style:italic; }
    .chart-desc { font-size:11.5px; color:var(--text-3); margin:4px 0 14px 13px; line-height:1.5; padding-right:66px; font-weight:600; letter-spacing:.2px; }
    /* Chart.js runs with maintainAspectRatio:false, so the container owns the
       height. `.auto` wrappers get an inline height from fitHeight() instead. */
    .chart-wrap { position:relative; height:280px; }
    .chart-wrap.tall { height:380px; }
    .chart-wrap.short { height:230px; }
    .chart-wrap.auto { height:auto; }
    .chart-wrap canvas { display:block; }
    .card-tools { position:absolute; top:16px; right:14px; display:flex; gap:5px; opacity:0; transition:opacity .2s; }
    .chart-card:hover .card-tools, .card-tools:focus-within { opacity:1; }
    .card-tools button { width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
               color:var(--text-3); font-size:12px; line-height:1; cursor:pointer; transition:background .2s,color .2s,border-color .2s; }
    .card-tools button:hover { background:var(--rs-red); border-color:var(--rs-red); color:#fff; }
    .no-data { display:flex; align-items:center; justify-content:center; height:100%; min-height:150px; color:var(--text-3); font-size:12.5px; text-align:center; padding:20px; line-height:1.6; }

    /* ===================== BOXES ===================== */
    .insight-box { border-radius:12px; padding:15px 19px; margin-bottom:18px; border-left:4px solid; font-size:13.2px; line-height:1.65; }
    .insight-box.primary { background:var(--tint-red); border-color:var(--rs-red); color:var(--on-tint-red); }
    .insight-box.navy { background:var(--tint-navy); border-color:var(--rs-navy-soft); color:var(--on-tint-navy); }
    .insight-box.amber { background:var(--tint-amber); border-color:var(--amber-500); color:var(--on-tint-amber); }
    .insight-box.teal { background:var(--tint-teal); border-color:var(--teal-500); color:var(--on-tint-teal); }
    .insight-box.purple { background:var(--tint-purple); border-color:var(--purple-500); color:var(--on-tint-purple); }
    .insight-box.green { background:var(--tint-green); border-color:var(--green-600); color:var(--on-tint-green); }
    .insight-box strong { font-weight:700; }
    .insight-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px; }

    .callout-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:24px; }
    .callout { border-radius:12px; padding:16px; display:flex; gap:12px; align-items:flex-start; }
    .callout.primary { background:var(--tint-red); } .callout.navy { background:var(--tint-navy); }
    .callout.amber { background:var(--tint-amber); } .callout.teal { background:var(--tint-teal); }
    .callout.purple { background:var(--tint-purple); } .callout.green { background:var(--tint-green); }
    .callout-icon { font-size:21px; flex-shrink:0; margin-top:2px; }
    .callout-body h4 { font-size:13.5px; font-weight:700; color:var(--text); line-height:1.4; }
    .callout-body p { font-size:12.5px; color:var(--text-2); margin-top:4px; line-height:1.5; }

    .footnote { font-size:11px; color:var(--text-3); margin-top:18px; padding-top:12px; border-top:1px solid var(--border); line-height:1.6; }
    .page-footer { background:var(--rs-navy-dark); color:rgba(255,255,255,.45); font-size:11.5px; text-align:center; padding:20px 32px; letter-spacing:.3px; border-top:3px solid var(--rs-red); margin-top:40px; line-height:1.9; }
    .page-footer strong { color:rgba(255,255,255,.8); }

    /* ===================== TABLES ===================== */
    .tbl-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
    .tbl-search { flex:1; min-width:230px; padding:10px 15px; border:2px solid var(--border); border-radius:10px; font-family:'Inter',sans-serif; font-size:13.5px; color:var(--text); background:var(--surface); outline:none; transition:border-color .2s; }
    .tbl-search:focus { border-color:var(--rs-red); }
    .tbl-count { font-size:12.5px; color:var(--text-2); font-weight:600; margin-left:auto; font-variant-numeric:tabular-nums; }
    .tbl-export { padding:10px 15px; border:none; border-radius:10px; background:var(--rs-navy); color:#fff; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; cursor:pointer; transition:background .2s; }
    .tbl-export:hover { background:var(--rs-red); }
    .tbl-wrap { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
    .tbl-scroll { max-height:660px; overflow:auto; }
    .dtbl { width:100%; border-collapse:collapse; font-size:12.8px; }
    .dtbl th { background:var(--rs-navy); color:rgba(255,255,255,.92); font-weight:600; text-align:left; padding:12px 13px; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; cursor:pointer; user-select:none; white-space:nowrap; position:sticky; top:0; z-index:2; }
    .dtbl th:hover { background:var(--rs-navy-mid); }
    .dtbl th.num, .dtbl td.num { text-align:center; }
    .dtbl th .arrow { font-size:9px; opacity:.7; margin-left:3px; }
    .dtbl td { padding:10px 13px; border-bottom:1px solid var(--border); color:var(--text-2); vertical-align:middle; }
    .dtbl tbody tr:hover td { background:var(--rs-navy-50); }
    .dtbl tbody tr:last-child td { border-bottom:none; }
    .tbl-empty { text-align:center; padding:36px 14px; color:var(--text-3); font-size:13px; }
    .cell-strong { font-weight:600; color:var(--text); }
    .cell-sub { font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.4px; }
    .bar-mini { height:7px; width:78px; background:var(--track); border-radius:99px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px; }
    .bar-mini > span { display:block; height:100%; border-radius:99px; }
    .pct-txt { font-weight:700; font-size:12.5px; font-variant-numeric:tabular-nums; }
    .badge { display:inline-block; padding:3px 9px; border-radius:99px; font-size:10.8px; font-weight:600; white-space:nowrap; }
    .badge-green { background:var(--tint-green); color:var(--on-tint-green); }
    .badge-amber { background:var(--tint-amber); color:var(--on-tint-amber); }
    .badge-grey  { background:var(--track);      color:var(--text-2); }
    .badge-red   { background:var(--tint-red);   color:var(--on-tint-red); }
    .badge-teal  { background:var(--tint-teal);  color:var(--on-tint-teal); }
    .badge-purple{ background:var(--tint-purple);color:var(--on-tint-purple); }
    .tick { font-weight:800; } .tick.y { color:var(--green-600); } .tick.n { color:var(--text-3); }

    .prog-head { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-2); margin:26px 0 12px; }
